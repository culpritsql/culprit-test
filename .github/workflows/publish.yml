name: Publish

# Publishes @culpritsql/test to npm via OIDC Trusted Publishing and creates a GitHub Release
# with the offline .tgz tarball and SHA256SUMS.txt when a v* tag is pushed (or dispatched manually).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to verify, publish to npm, and release on GitHub"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Omit registry-url so setup-node does not inject a placeholder _authToken that blocks npm OIDC.
          node-version: "24"
      - id: meta
        name: Verify release tag matches package version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
          VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1; }
          printf 'tag=%s\nversion=%s\n' "$TAG" "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies, build, and test
        run: |
          set -euo pipefail
          bun install --frozen-lockfile || bun install
          npm run build
          ./node_modules/.bin/tsc --noEmit -p tsconfig.check.json
          bun test
      - name: Pack release tarball and checksums
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          npm pack --pack-destination "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum ./*.tgz > SHA256SUMS.txt && sed 's| \./| |' -i SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Publish @culpritsql/test with OIDC provenance
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@culpritsql/test@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@culpritsql/test@${PACKAGE_VERSION} is already published on npm; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance

  github-release:
    name: Create GitHub release
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-assets
          path: assets
      - name: Create GitHub release with npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.npm.outputs.tag }}
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi
          cat <<EOF > "$RUNNER_TEMP/notes.md"
          Install from npm:

          \`\`\`sh
          npm install -D @culpritsql/test@${VERSION}
          \`\`\`

          - npm registry: https://www.npmjs.com/package/@culpritsql/test/v/${VERSION}
          - Offline tarball: \`culpritsql-test-${VERSION}.tgz\` (attached below with \`SHA256SUMS.txt\`)
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          cd assets
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "@culpritsql/test ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            ./*
