name: Publish

# Automatically updates @culpritsql/plans, builds, tests, bumps monotonic semver,
# publishes @culpritsql/test to npm via OIDC Trusted Publishing, and creates a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  repository_dispatch:
    types: [upstream-pkg-published]
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing v* tag to verify, publish to npm, and release on GitHub"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[skip ci]'))"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      should_publish: ${{ steps.prepare.outputs.should_publish }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - id: prepare
        name: Resolve upstream @culpritsql/plans, build, test, and determine release version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --tags origin --force

          IS_EXPLICIT_TAG="false"
          if [ -n "$REQUESTED_TAG" ] || [[ "$EVENT_REF" == refs/tags/v* ]]; then
            IS_EXPLICIT_TAG="true"
          fi

          if [ "$IS_EXPLICIT_TAG" = "true" ]; then
            TAG="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
            VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
            [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1; }
            bun install --frozen-lockfile || bun install
            npm run build
            ./node_modules/.bin/tsc --noEmit -p tsconfig.check.json
            bun test
            printf 'should_publish=true\ntag=%s\nversion=%s\nneeds_git_push=false\n' "$TAG" "$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PLANS_LATEST="$(npm view @culpritsql/plans version)"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@culpritsql/plans"] = `^${process.argv[1]}`;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$PLANS_LATEST"
          bun install --no-cache

          PREV_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 || true)"
          CHANGED="false"
          if [ -z "$PREV_TAG" ]; then
            CHANGED="true"
          else
            if ! git diff --quiet "$PREV_TAG" -- package.json bun.lock; then
              CHANGED="true"
            elif ! git diff --quiet "$PREV_TAG" HEAD -- src/ README.md LICENSE; then
              CHANGED="true"
            fi
          fi

          if [ "$CHANGED" != "true" ]; then
            echo "No upstream @culpritsql/plans updates or package changes since ${PREV_TAG}; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm run build
          ./node_modules/.bin/tsc --noEmit -p tsconfig.check.json
          bun test

          NEXT_VERSION="$(node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const [cMaj, cMin, cPatch] = pkg.version.split(".").map(Number);
            const prev = process.argv[1];
            let next = pkg.version;
            if (prev) {
              const [tMaj, tMin, tPatch] = prev.replace(/^v/, "").split(".").map(Number);
              if (cMaj > tMaj || (cMaj === tMaj && cMin > tMin)) {
                next = `${cMaj}.${cMin}.${cPatch}`;
              } else {
                const p = (cMaj === tMaj && cMin === tMin) ? Math.max(tPatch + 1, cPatch) : tPatch + 1;
                next = `${tMaj}.${tMin}.${p}`;
              }
            }
            pkg.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            process.stdout.write(next);
          ' "$PREV_TAG")"

          printf 'should_publish=true\ntag=v%s\nversion=%s\nneeds_git_push=true\n' "$NEXT_VERSION" "$NEXT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag monotonic release on main
        if: steps.prepare.outputs.should_publish == 'true' && steps.prepare.outputs.needs_git_push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"

          git config user.name "culprit-bot"
          git config user.email "noreply@culpritsql.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "refs/tags/${TAG}"
      - name: Pack release tarball and checksums
        if: steps.prepare.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          npm pack --pack-destination "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum ./*.tgz > SHA256SUMS.txt && sed 's| \./| |' -i SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.should_publish == 'true'
        with:
          name: npm-release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Publish @culpritsql/test with OIDC provenance
        if: steps.prepare.outputs.should_publish == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@culpritsql/test@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@culpritsql/test@${PACKAGE_VERSION} is already published on npm; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance

  github-release:
    name: Create GitHub release
    needs: [npm]
    if: needs.npm.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-assets
          path: assets
      - name: Create GitHub release with npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.npm.outputs.tag }}
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi
          cat <<EOF > "$RUNNER_TEMP/notes.md"
          Install from npm:

          \`\`\`sh
          npm install -D @culpritsql/test@${VERSION}
          \`\`\`

          - npm registry: https://www.npmjs.com/package/@culpritsql/test/v/${VERSION}
          - Offline tarball: \`culpritsql-test-${VERSION}.tgz\` (attached below with \`SHA256SUMS.txt\`)
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          cd assets
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "@culpritsql/test ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            ./*
